name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # A versão tem uma fonte de verdade só (package.json da raiz) e oito
      # lugares derivados dela, dois deles literais em código. Verificar aqui é
      # o que impede o conserto de um lugar só passar despercebido.
      - run: pnpm version:check
      - run: pnpm --filter @sparta/api prisma:generate
      - run: pnpm typecheck
      - run: pnpm lint
      # `build` ANTES de `test`, e não depois. `packages/core` publica
      # `main: dist/index.js`, então quem o importa por nome — os testes de
      # `packages/riot` — só resolve o pacote depois que ele foi compilado.
      # Num runner limpo `dist/` não existe, e a suíte falhava com
      # "Failed to resolve entry for package @sparta/core". Localmente a falha
      # ficava mascarada porque `dist/` sobrevivia de builds anteriores.
      #
      # A regra que isso preserva: teste não pode depender de artefato residual
      # do workspace. Inverter a ordem é o que torna o CI uma verificação de
      # ambiente limpo em vez de uma verificação da máquina de quem rodou por
      # último.
      - run: pnpm build
      - run: pnpm test

  analyzer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: pip install -e "services/analyzer[test]"
      - run: pytest services/analyzer
