<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Confirmar email — Sparta GG</title>
    <meta
      name="description"
      content="Confirme o email da sua conta Sparta GG a partir do link enviado por email."
    />
    <link rel="canonical" href="https://spartagg.com.br/confirmar-email" />
    <link rel="icon" type="image/png" href="/img/favicon.png" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#07080a" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sparta GG" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:title" content="Confirmar email — Sparta GG" />
    <meta property="og:description" content="Confirme o email da sua conta Sparta GG." />
    <meta property="og:url" content="https://spartagg.com.br/confirmar-email" />
    <link rel="stylesheet" href="/src/styles/tokens.css" />
    <link rel="stylesheet" href="/src/styles/base.css" />
    <link rel="stylesheet" href="/src/styles/site.css" />
  </head>
  <body>
    <a class="sp-skip-link" href="#sp-main">Ir para o conteúdo</a>
    <header class="sp-header" id="sp-header"></header>

    <main id="sp-main">
      <section class="sp-hero sp-hero--page">
        <div class="sp-container">
          <p class="sp-eyebrow">Conta</p>
          <h1>Confirmar email</h1>
          <p class="sp-hero__sub">
            Esta página conclui a confirmação do email da sua conta Sparta GG. Ela não faz parte
            de uma área de conta completa — depois de confirmar, volte ao aplicativo Desktop.
          </p>
        </div>
      </section>

      <section class="sp-section sp-section--tight" data-reveal>
        <div class="sp-container">
          <div
            id="sp-confirm-status"
            class="sp-form-status"
            role="status"
            aria-live="polite"
          >
            Confirmando…
          </div>
          <div class="sp-btn-row">
            <a class="sp-btn sp-btn--ghost" href="/suporte">Precisa de ajuda?</a>
          </div>
        </div>
      </section>
    </main>

    <footer class="sp-footer" id="sp-footer"></footer>
    <script type="module" src="/src/scripts/layout.ts"></script>
    <script type="module" src="/src/scripts/confirmar-email.ts"></script>
  </body>
</html>
